name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: find src test scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run paper:dry-run
      - run: npm run paper:fee-analysis
